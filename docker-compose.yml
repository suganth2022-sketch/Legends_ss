version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: legends_postgres
    restart: always
    environment:
      POSTGRES_USER: legends_user
      POSTGRES_PASSWORD: legends_password_2026
      POSTGRES_DB: legends_mlm_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U legends_user -d legends_mlm_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legends_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
